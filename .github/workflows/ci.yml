name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ledgerapp_test
          POSTGRES_PASSWORD: ledgerapp_test_password
          POSTGRES_USER: ledgerapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerapp -d ledgerapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm through Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Load local development configuration
        run: cp .env.example .env

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Migrate isolated integration database
        env:
          DATABASE_URL: postgresql://ledgerapp:ledgerapp_test_password@localhost:5432/ledgerapp_test?schema=public
        run: pnpm --filter @ledgerapp/db exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Integration test
        env:
          TEST_DATABASE_URL: postgresql://ledgerapp:ledgerapp_test_password@localhost:5432/ledgerapp_test?schema=public
        run: pnpm test:integration

      - name: Build
        run: pnpm build
