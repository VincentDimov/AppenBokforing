name: Continuous integration

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ledgerapp_test
          POSTGRES_PASSWORD: ledgerapp_test_password
          POSTGRES_USER: ledgerapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerapp -d ledgerapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm through Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Load local development configuration
        run: cp .env.example .env

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Migrate isolated integration database
        env:
          DATABASE_URL: postgresql://ledgerapp:ledgerapp_test_password@localhost:5432/ledgerapp_test?schema=public
        run: pnpm --filter @ledgerapp/db exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Lint
        run: pnpm lint
      - name: Production dependency advisory gate (expiring scoped exceptions)
        run: node scripts/security-audit.cjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
      - name: Scoped Prisma config dependency compatibility
        run: node --test tests/prisma-config-compatibility.test.cjs
      - name: Restore tooling syntax and report-only reconciliation contract
        run: |
          node --check scripts/restore-drill.cjs
          node --check scripts/restore-database-drill.cjs
          node --test tests/storage-reconciliation.test.cjs

      - name: Integration test
        env:
          TEST_DATABASE_URL: postgresql://ledgerapp:ledgerapp_test_password@localhost:5432/ledgerapp_test?schema=public
        run: pnpm test:integration

      - name: Build
        env:
          API_INTERNAL_URL: https://ledgerapp-api.example.invalid
        run: pnpm build

  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      E2E_DATABASE_URL: postgresql://ledgerapp:disposable_ci_only@127.0.0.1:5432/ledgerapp_e2e
      S3_ENDPOINT: http://127.0.0.1:19500
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:19500
      S3_REGION: eu-north-1
      S3_FORCE_PATH_STYLE: "true"
      S3_BUCKET: ledgerapp-e2e-ci
      S3_ACCESS_KEY_ID: disposable_drill_user
      S3_SECRET_ACCESS_KEY: disposable_drill_secret_only
    services:
      storage:
        image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
        env:
          RUSTFS_ACCESS_KEY: disposable_drill_user
          RUSTFS_SECRET_KEY: disposable_drill_secret_only
          RUSTFS_CONSOLE_ENABLE: "false"
        ports:
          - 19500:9000
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ledgerapp_e2e
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_USER: ledgerapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerapp -d ledgerapp_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The 4188ca6 run exhausted its job timeout while apt's Azure mirror hung.
      # Use Ubuntu's canonical HTTPS archive and bound apt network attempts;
      # dependency or browser installation failure still fails the job.
      - name: Install browser OS dependencies from canonical Ubuntu archive
        timeout-minutes: 5
        run: |
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu|g; s|mirror+file:/etc/apt/apt-mirrors-security.txt|https://security.ubuntu.com/ubuntu|g; s|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "1";\n' | sudo tee /etc/apt/apt.conf.d/99-ledgerapp-network-timeouts
          pnpm exec playwright install-deps chromium
      - name: Install pinned Chromium
        timeout-minutes: 5
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "60000"
        run: pnpm exec playwright install chromium
      - run: node --test scripts/e2e-safety.test.cjs
      - name: Prepare isolated private browser-test storage
        run: node scripts/prepare-e2e-storage.cjs
      - name: Browser to local API to disposable PostgreSQL
        env:
          E2E_DATABASE_URL: postgresql://ledgerapp:disposable_ci_only@127.0.0.1:5432/ledgerapp_e2e
        run: pnpm test:e2e
      # No production smoke or production credentials in PR CI.
      # Disposable cookie traces are deliberately not uploaded as public artifacts.

  recovery-runtime-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build recovery dependencies
        run: pnpm --filter @ledgerapp/db build && pnpm --filter @ledgerapp/sie build && pnpm --filter @ledgerapp/api build
      - name: Start dedicated disposable recovery services
        run: |
          docker run -d --name ledgerapp-fas24-pg-20261007 -p 127.0.0.1:15440:5432 -e POSTGRES_USER=ledgerapp_test -e POSTGRES_PASSWORD=local_disposable_test_only -e POSTGRES_DB=ledgerapp_drill postgres:16-alpine
          docker run -d --name ledgerapp-fas24-restore-20261007 -p 127.0.0.1:15441:5432 -e POSTGRES_USER=ledgerapp_test -e POSTGRES_PASSWORD=local_disposable_test_only -e POSTGRES_DB=ledgerapp_restore postgres:16-alpine
          docker run -d --name ledgerapp-fas24-storage-20261007 -p 127.0.0.1:19500:9000 -e RUSTFS_ACCESS_KEY=disposable_drill_user -e RUSTFS_SECRET_KEY=disposable_drill_secret_only -e RUSTFS_CONSOLE_ENABLE=false rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
          for container in ledgerapp-fas24-pg-20261007 ledgerapp-fas24-restore-20261007; do
            ready=false
            for attempt in $(seq 1 20); do
              if docker exec "$container" pg_isready -U ledgerapp_test; then ready=true; break; fi
              sleep 2
            done
            test "$ready" = true
          done
          docker exec ledgerapp-fas24-pg-20261007 createdb -U ledgerapp_test ledgerapp_upgrade_3034
      - name: Apply full migrations to empty source
        env:
          DATABASE_URL: postgresql://ledgerapp_test:local_disposable_test_only@127.0.0.1:15440/ledgerapp_drill
        run: pnpm --filter @ledgerapp/db exec prisma migrate deploy --schema prisma/schema.prisma
      - name: DB and private blob restore with negative reconciliation fixtures
        env:
          RUN_DISPOSABLE_RESTORE_DRILL: "yes"
        run: node scripts/restore-drill.cjs
      - name: Actual runtime LOGIN and restored protections
        env:
          RUN_DISPOSABLE_RESTORE_DRILL: "yes"
        run: |
          node scripts/verify-runtime-login.cjs
          node scripts/verify-restored-guards.cjs
      - name: Real S3 upload versus posting, locking and calendar move
        env:
          RUN_DISPOSABLE_RESTORE_DRILL: "yes"
        run: node scripts/verify-storage-races.cjs
      - name: Older schema forward upgrade preserves ordinary records
        env:
          RUN_DISPOSABLE_RESTORE_DRILL: "yes"
        run: node scripts/verify-migration-upgrade.cjs
